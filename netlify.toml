# Mizanora Net TV — Netlify config (API functions + static site publish).
# Website: Firebase Hosting (see firebase.json) · API: Netlify Functions (free tier).
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------- clean static routes ----------
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/reseller"
  to = "/reseller.html"
  status = 200
[[redirects]]
  from = "/reseller/*"
  to = "/reseller.html"
  status = 200
[[redirects]]
  from = "/developers"
  to = "/developers.html"
  status = 200
[[redirects]]
  from = "/guide"
  to = "/developers.html"
  status = 200
[[redirects]]
  from = "/academy"
  to = "/academy.html"
  status = 200
[[redirects]]
  from = "/academy/*"
  to = "/academy.html"
  status = 200
[[redirects]]
  from = "/c"
  to = "/portal.html"
  status = 200
[[redirects]]
  from = "/c/"
  to = "/portal.html"
  status = 200

# ---------- dynamic API + protocol routes -> router function ----------
# Existing static files are always served first (force=false). Everything else
# reaches the `app` function: /api/*, player_api.php, get.php, xmltv.php,
# /live|movie|series, portal.php, stalker_portal/*, /c/portal.php, /s/*,
# /playout/* and media MPEG-TS .ts aliases (302 -> .m2ts).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

# ---------- cache + security headers (static parity with firebase.json) ----------
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
[[headers]]
  for = "/reseller.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
