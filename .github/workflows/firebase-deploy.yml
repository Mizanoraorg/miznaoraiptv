# Mizanora IPTV — Firebase Hosting + Functions + Realtime Database deploy.
#
# One workflow, everything covered:
#   • test     — full HTTP/API + DOM regression suites on every push/PR
#   • deploy   — firebase deploy --only hosting,functions,database (push to main / manual)
#   • preview  — Firebase Hosting preview channel for every pull request
#
# Required GitHub repo secret:
#   FIREBASE_SERVICE_ACCOUNT — full service-account JSON
#   (Firebase Console → Project settings → Service accounts → Generate new private key)
#
# Optional GitHub repo variable (Settings → Secrets and variables → Actions → Variables):
#   MZ_NO_FUNCTIONS = 1  → billing-free mode: hosting + database deploy hoti hain,
#   Cloud Functions skip (Google billing ke bagair Cloud Build/Run enable nahi hote).
#   API phir Vercel (free) par chalti hai — see docs/FIREBASE.md "FREE setup".
#
name: Firebase Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: HTTP, API and DOM smoke suites
        run: npm test

  deploy:
    name: Deploy hosting + functions + database
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    concurrency: firebase-production-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build functions bundle
        run: npm run build:functions
      - name: Install functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Enable required Google Cloud APIs (best effort)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project=mizanoranet
          if ! gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com --project=mizanoranet; then
            echo "::warning::APIs automatically enable nahi ho sakin. Project owner se ye 4 links open karke enable karwayein (ek click each): https://console.cloud.google.com/apis/library/cloudfunctions.googleapis.com?project=mizanoranet , https://console.cloud.google.com/apis/library/cloudbuild.googleapis.com?project=mizanoranet , https://console.cloud.google.com/apis/library/artifactregistry.googleapis.com?project=mizanoranet , https://console.cloud.google.com/apis/library/run.googleapis.com?project=mizanoranet — details: docs/FIREBASE.md"
          fi
      - name: Firebase deploy — hosting + database rules (works without Cloud Build)
        run: npx --yes firebase-tools@13 deploy --only hosting,database --project mizanoranet --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - name: Firebase deploy — Cloud Functions (app)
        id: deploy_functions
        if: vars.MZ_NO_FUNCTIONS != '1'
        continue-on-error: true
        run: npx --yes firebase-tools@13 deploy --only functions --project mizanoranet --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - name: Functions deploy status
        if: vars.MZ_NO_FUNCTIONS != '1' && steps.deploy_functions.outcome == 'failure'
        run: |
          echo "::warning::Cloud Functions deploy failed. Common cause: Firebase/GCP billing not enabled or required APIs (cloudfunctions, cloudbuild, artifactregistry, run) not enabled for project mizanoranet. Hosting+database already deployed. To skip functions until billing is enabled, set repo variable MZ_NO_FUNCTIONS=1. See docs/FIREBASE.md."
          echo "Hosting + database are live; functions need billing/API enablement."
      - name: Free-mode notice (functions skipped)
        if: vars.MZ_NO_FUNCTIONS == '1'
        run: echo "::notice::MZ_NO_FUNCTIONS=1 — Cloud Functions skip hue. Site Firebase Hosting par live hai aur API base (public/assets/js/api-base.js) se chal raha hai. Billing on karte hi MZ_NO_FUNCTIONS variable hatayein — full Firebase stack on ho jayega."

  preview:
    name: Hosting preview channel
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency: firebase-preview-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build functions bundle
        run: npm run build:functions
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy PR preview channel (expires in 7 days)
        run: npx --yes firebase-tools@13 hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project mizanoranet --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
