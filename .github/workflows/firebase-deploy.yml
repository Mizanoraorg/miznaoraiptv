# Mizanora IPTV — Firebase Hosting + Functions + Realtime Database deploy.
#
# One workflow, everything covered:
#   • test     — full HTTP/API + DOM regression suites on every push/PR
#   • deploy   — firebase deploy --only hosting,functions,database (push to main / manual)
#   • preview  — Firebase Hosting preview channel for every pull request
#
# Required GitHub repo secret:
#   FIREBASE_SERVICE_ACCOUNT — full service-account JSON
#   (Firebase Console → Project settings → Service accounts → Generate new private key)
#
name: Firebase Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: HTTP, API and DOM smoke suites
        run: npm test

  deploy:
    name: Deploy hosting + functions + database
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    concurrency: firebase-production-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build functions bundle
        run: npm run build:functions
      - name: Install functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Firebase deploy (hosting + functions + database rules)
        run: npx --yes firebase-tools@13 deploy --only hosting,functions,database --project mizanoranet --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  preview:
    name: Hosting preview channel
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency: firebase-preview-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build functions bundle
        run: npm run build:functions
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy PR preview channel (expires in 7 days)
        run: npx --yes firebase-tools@13 hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project mizanoranet --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
